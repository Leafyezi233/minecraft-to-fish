plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 如果需要依赖其他 Fabric 模组（如 Cloth Config 等），在这里加 maven 仓库
}

loom {
	// 国内镜像加速（可选）：从 gradle.properties 读 loom_custom_manifest，
	// 若配置了则直接指定 1.20.1 版本 json 的镜像 URL，绕过 Mojang 域名。
	def customManifest = providers.gradleProperty('loom_custom_manifest').orNull
	if (customManifest != null) {
		customMinecraftManifest = customManifest
	}
}

dependencies {
	// 主 Minecraft 依赖 + Yarn 映射
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	// Fabric Loader + Fabric API
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	// 1.20.1 用 Java 17
	it.options.release = 17
}

java {
	// 自动使用 Java 17 工具链（Gradle 会自动下载 JDK 17，若本机没有的话）
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

// 注：如需 access widener（改原版成员可见性），再在此配置。