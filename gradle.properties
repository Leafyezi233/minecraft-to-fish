# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric (Minecraft 1.20.1)
# yarn 1.20.1+build.10 是 1.20.1 的最终/标准映射版本
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.10

# Fabric API: 0.92.12+1.20.1 是 1.20.1 最新的官方修复版（已验证仍被维护）
fabric_version=0.92.12+1.20.1

# Mod metadata
mod_version=0.4.1-dev
maven_group=com.leafyezi233
archives_base_name=minecraft_to_fish

# ============================================================
# 国内镜像加速（可选）
# 说明：Loom 默认从 Mojang 官方域名(piston-meta/libraries.minecraft.net 等)下载
#   Minecraft 本体和依赖库，这些域名在国内常被墙/超时。
#   下面的 BMCLAPI 是国内镜像，已实测可达且完整镜像了 Mojang 的路径。
# 如果你在自己的电脑上构建、且能直连 Mojang（网络正常），
#   删除下面这 4 行即可恢复官方下载（默认行为）。
# ============================================================
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
loom_libraries_base=https://bmclapi2.bangbang93.com/libraries
loom_resources_base=https://bmclapi2.bangbang93.com/
loom_custom_manifest=https://bmclapi2.bangbang93.com/version/1.20.1/1.20.1.json